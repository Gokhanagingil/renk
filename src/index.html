<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#172447"><title>Renk Durağı · Şehir hareketli</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
<header><div class="brand"><span class="brand-icon" aria-hidden="true">P<span>↗</span></span><div><h1>RENK DURAĞI</h1><small>ŞEHİR HAREKETLİ</small></div></div><div class="header-buttons"><button id="sound" class="round" aria-label="Ses aç">♪<i></i></button><button id="help" class="round" aria-label="Nasıl oynanır?">?</button></div></header>
<section class="level-strip"><button id="level-menu" aria-label="Bölüm seç"><b id="level-number">01</b><span>/ 18 ▾</span></button><div class="level-name"><strong id="level-title"></strong><small id="goal">Yolu aç, herkesi bindir.</small></div><div class="completion"><b id="departed"></b><small>ARAÇ AYRILDI</small></div></section>
<div class="terminal">
<section class="passengers"><div class="section-title"><span>Yolcu sırası <small>· önce soldaki</small></span><button id="queue-info" aria-label="Yolcu sırasının tamamı">Tüm sıra ↗</button></div><div class="queue-wrap"><span class="queue-arrow" aria-hidden="true">1</span><div id="queue" class="queue"></div><span id="queue-count"></span></div><div class="queue-progress"><i id="queue-progress"></i></div></section>
<div class="walkway" aria-hidden="true"><span>YAYA YOLU</span><i></i><i></i><i></i></div>
<section id="stop" class="stop"><div class="section-title"><span>Biniş peronu</span><span id="free-slots">3 yer boş</span></div><div id="bays" class="bays"></div></section>
<div class="road" aria-hidden="true"><span>→</span><i></i><i></i><i></i><span>→</span></div>
</div>
<section class="parking-section"><div class="parking-heading"><span><b>Şehir otoparkı</b><small id="lot-count"></small></span><button id="overview" aria-label="Otoparkın tamamını göster">Kuşbakışı ⤢</button></div><div id="lot-viewport" class="lot-viewport" tabindex="0" role="region" aria-label="Otopark, devamını görmek için yukarı kaydır"><div id="lot-world" class="lot-world"><div class="lot-entry" aria-hidden="true"><span class="parking-sign">P</span><span>ÇIKIŞ ↑</span><div class="crosswalk"></div><span class="tree">✦</span></div><div id="parking" class="parking"><div id="markings" aria-hidden="true"></div><div id="cars"></div></div><div id="exit-layer" class="exit-layer"></div><div class="lot-end" aria-hidden="true"><span>↓ ÇIKIŞ</span><i></i><span class="tree">✦</span></div></div></div><div class="scroll-cue"><span>↕ Kaydır · otoparkın devamını gör</span><span id="lot-position">A</span></div></section>
<div id="message" class="message" role="status" aria-live="polite"></div>
<nav class="toolbar" aria-label="Oyun kontrolleri"><button id="undo" aria-label="Geri al"><span aria-hidden="true">↶</span>Geri al</button><button id="hint" aria-label="İpucu"><span aria-hidden="true">✦</span>İpucu</button><button id="speed" aria-label="Hareket hızı"><span>♧</span><small>Sakin</small></button><button id="restart" aria-label="Yeniden"><span aria-hidden="true">↻</span>Yeniden</button></nav>
<footer><span>RENK DURAĞI · 0.4</span><span>Acele yok. Yol var.</span></footer>
</main><div id="overlay" class="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button id="close-modal" class="close" aria-label="Kapat">×</button><div id="modal-content"></div></section></div>
<script src="engine.js"></script><script src="levels.js"></script><script src="app.js"></script></body></html>
