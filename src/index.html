<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f2e8"><title>Renk Durağı · Parkı çöz</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
<header><div class="brand"><span class="brand-icon">↗</span><div><h1>renk durağı<span>•</span></h1><small>YOLU AÇ. SIRAYI DÜŞÜN.</small></div></div><div class="header-buttons"><button id="sound" class="round" aria-label="Ses aç">♪<i></i></button><button id="help" class="round" aria-label="Nasıl oynanır?">?</button></div></header>
<section class="level-strip"><button id="level-menu" aria-label="Bölüm seç"><b id="level-number">01</b><span>/ 12 ▾</span></button><div class="level-name"><strong id="level-title"></strong><small id="goal">Parkı boşalt, herkesi bindir.</small></div><div class="completion"><b id="departed">0 / 4</b><small>ARAÇ AYRILDI</small></div></section>
<section class="passengers"><div class="section-title"><span>YOLCU SIRASI <small>· önce soldaki</small></span><button id="queue-info" aria-label="Yolcu sırasının tamamı">Tüm sıra ↗</button></div><div class="queue-wrap"><span class="queue-arrow" aria-hidden="true">›</span><div id="queue" class="queue"></div><span id="queue-count"></span></div><div class="queue-progress"><i id="queue-progress"></i></div></section>
<section id="stop" class="stop"><div class="section-title"><span>BİNİŞ DURAĞI</span><span id="free-slots">3 yer boş</span></div><div id="bays" class="bays"></div></section>
<div class="road" aria-hidden="true"><span>←</span><i></i><i></i><i></i><span>→</span></div>
<section class="parking-section"><div class="section-title"><span>OTOPARK</span><small>Ok yönünde çıkar · sayı = koltuk</small></div><div id="parking" class="parking" aria-label="Birbirinin yolunu kapatan araçlar"></div></section>
<div id="message" class="message" role="status" aria-live="polite"></div>
<nav class="toolbar" aria-label="Oyun kontrolleri"><button id="undo" aria-label="Geri al"><span aria-hidden="true">↶</span>Geri al</button><button id="hint" aria-label="İpucu"><span aria-hidden="true">✦</span>İpucu</button><button id="speed" aria-label="Animasyon hızı"><span>1×</span>Hız</button><button id="restart" aria-label="Yeniden"><span aria-hidden="true">↻</span>Yeniden</button></nav>
<footer><span>PARK BULMACASI · 0.3</span><span>Önce düşün, sonra yola çık.</span></footer>
</main><div id="overlay" class="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button id="close-modal" class="close" aria-label="Kapat">×</button><div id="modal-content"></div></section></div>
<script src="engine.js"></script><script src="levels.js"></script><script src="app.js"></script></body></html>
