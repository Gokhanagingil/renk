<div class="walkway" aria-hidden="true"><span>YAYA YOLU</span><i></i><i></i><i></i></div>

<div class="road" aria-hidden="true"><span>→</span><i></i><i></i><i></i><span>→</span></div>
</div>
<section class="parking-section"><div class="parking-heading"><div><b id="level-title"></b><small id="lot-count"></small></div><span class="completion"><b id="departed"></b></span><button id="overview" aria-label="Otoparkı yakınlaştır" aria-pressed="false">Yakınlaştır +</button></div><div id="lot-viewport" class="lot-viewport" tabindex="0" role="region" aria-label="Otopark, tamamı ekrana sığar"><div id="lot-world" class="lot-world"><div class="lot-entry" aria-hidden="true"><span class="parking-sign">P</span><span>ÇIKIŞ ↑</span><div id="district-decor" class="district-decor"></div><span class="tree">✦</span></div><div id="parking" class="parking"><div id="markings" aria-hidden="true"></div><div id="cars"></div></div><div id="exit-layer" class="exit-layer"></div><div class="lot-end" aria-hidden="true"><span>↓ ÇIKIŞ</span><i></i><span class="street-cat" aria-hidden="true"><svg viewBox="0 0 34 24"><path class="cat-tail" d="M23 18q15 0 6-12" fill="none" stroke="#987b61" stroke-width="3"/><ellipse cx="16" cy="18" rx="10" ry="5" fill="#b99779"/><path d="M6 15V5l5 3 5-3 1 10Z" fill="#b99779"/><path d="M9 12h2m3 0h1" stroke="#514337" stroke-width="1.5"/></svg></span></div></div><section id="finish-card" class="finish-card" aria-label="Bölüm tamamlandı" hidden></section></div><div class="scroll-cue"><span id="view-label">Parkın tamamı · araca dokun</span><span id="lot-position"></span></div></section>
