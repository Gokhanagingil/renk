.slot-number{font-size:38px;font-weight:900;color:#becbe250}

.bay.long .bay-car{height:89px;width:35px}

.bay.reserved{background:repeating-linear-gradient(135deg,#596c8a 0 8px,#60718c 8px 16px)}

.jammed .bay{border-color:#ffb395}

.road i{width:25px;height:3px;background:#c1cede}
.road span{font-size:25px;line-height:25px}
.parking-section{margin:0 12px}
.parking-heading{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:10px 2px 7px}
.parking-heading b{display:block;font-size:15px}
.parking-heading small{display:block;font-size:11px;margin-top:3px;color:#627393}
.parking-heading button{border:1px solid #ccd6eb;background:#fff;border-radius:10px;min-height:44px;font-size:12px;padding:6px 10px}

.parking #cars{position:absolute;inset:0}

.parking-spot.S{border-bottom:0}
.parking-spot.E{border-right:0}
.parking-spot.W{border-left:0}

.car.obstacle{filter:drop-shadow(0 0 5px #ff8f66)}
.car.bump{animation:bump .3s 2}
.exit-layer{position:absolute;inset:0;pointer-events:none;z-index:4}

.stats small{font-size:10px;color:#7083a9}
.win-icon{font-size:48px;color:#ff944d}
.mini-note{font-size:12px!important}
.overview-map{position:relative;background:#36435b;border:10px solid #697b99;border-radius:10px;margin:15px auto;max-height:51vh;overflow:hidden}
.map-car{position:absolute;padding:1px;pointer-events:none}
.map-car svg{width:100%;height:100%;display:block}
.map-focus{position:absolute;left:0;width:100%;border:2px solid #fff0a1;background:#fff0a115;pointer-events:none}

.ghost-car.local{position:absolute;z-index:5}
.ghost-car svg{width:100%;height:100%;filter:drop-shadow(2px 4px 1px #15244370)}
.fly-person{position:fixed;pointer-events:none;z-index:31;width:30px;height:43px;will-change:transform}
.fly-person .body{animation:none}
.fly-person .leg-left{animation:walk .3s infinite alternate;transform-origin:13px 33px}
.fly-person .leg-right{animation:walk .3s infinite alternate-reverse;transform-origin:20px 33px}
.fly-person .mood-bubble{display:none}
@keyframes breathe{50%{transform:translateY(-1.5px) rotate(1deg)}
}
@keyframes wave{50%{transform:rotate(-35deg)}
}
@keyframes grumble{25%{transform:rotate(-7deg)}
75%{transform:rotate(7deg)}
}
@keyframes fidget{25%{transform:translateX(-1px) rotate(-4deg)}
75%{transform:translateX(1px) rotate(4deg)}
}
@keyframes walk{to{transform:rotate(20deg)}
}
@keyframes bump{25%{transform:translateX(-3px)}
75%{transform:translateX(3px)}
}

<script>
/* Pure parking rules. Animation completion is explicit; bays stay reserved. */
(function(root){
'use strict';
const copy=value=>JSON.parse(JSON.stringify(value));
function initial(level){return {parked:level.cars.map(c=>c.id),exiting:[],bays:[null,null,null],head:0,departed:[],moves:0};}
function car(level,id){return level.cars.find(c=>c.id===id);}
function blockers(level,state,id){
 const a=car(level,id);if(!a||!state.parked.includes(id))return [];
 return [...state.parked,...(state.exiting||[])].filter(other=>{
  if(other===id)return false;const b=car(level,other);
  if(a.dir==='N')return b.x<a.x+a.w&&b.x+b.w>a.x&&b.y+b.h<=a.y;
  if(a.dir==='S')return b.x<a.x+a.w&&b.x+b.w>a.x&&b.y>=a.y+a.h;
  if(a.dir==='W')return b.y<a.y+a.h&&b.y+b.h>a.y&&b.x+b.w<=a.x;
  return b.y<a.y+a.h&&b.y+b.h>a.y&&b.x>=a.x+a.w;
 }).sort((i,j)=>{const b=car(level,i),c=car(level,j);return a.dir==='N'?c.y-b.y:a.dir==='S'?b.y-c.y:a.dir==='W'?c.x-b.x:b.x-c.x;});
}
function settle(level,state,events=[]){
 while(state.head<level.queue.length){
  const color=level.queue[state.head],slot=nextBoard(level,state);
  if(slot<0)break;
  const b=state.bays[slot],v=car(level,b.id);b.filled++;
  events.push({type:'board',id:b.id,slot,color,index:state.head++,filled:b.filled});
  if(b.filled===v.capacity){state.bays[slot]=null;state.departed.push(v.id);events.push({type:'depart',id:v.id,slot});}
 }
 return events;
}
function step(level,previous,id){
 if(!Number.isInteger(id)||!previous.parked.includes(id))return {ok:false,reason:'missing'};
 const blockedBy=blockers(level,previous,id);if(blockedBy.length)return {ok:false,reason:'blocked',blockedBy};
 const slot=previous.bays.indexOf(null);if(slot<0)return {ok:false,reason:'full'};
 const state=copy(previous);state.parked=state.parked.filter(v=>v!==id);state.moves++;state.bays[slot]={id,filled:0,ticket:state.moves,phase:'waiting'};
 const events=[{type:'move',id,slot}];settle(level,state,events);return {ok:true,state,events};
}
function won(level,state){return state.head===level.queue.length&&state.parked.length===0&&state.bays.every(b=>b===null);}
function legal(level,state){return state.bays.includes(null)?state.parked.filter(id=>!blockers(level,state,id).length):[];}
function active(level,state){return state.bays.some(b=>b&&['driving','leaving'].includes(b.phase))||nextBoard(level,state)>=0;}
function deadlocked(level,state){return !won(level,state)&&!active(level,state)&&legal(level,state).length===0;}
function key(s){return s.parked.join(',')+'|'+s.bays.map(b=>b?b.id+':'+b.filled+':'+b.ticket:'-').join(',')+'|'+s.head;}
function nextBoard(level,state){
 if(state.head>=level.queue.length)return -1;
 const options=state.bays.map((b,slot)=>({b,slot})).filter(({b})=>b&&b.phase!=='leaving'&&b.filled<car(level,b.id).capacity&&car(level,b.id).color===level.queue[state.head]);
 options.sort((a,b)=>a.b.ticket-b.b.ticket);
 return options.length&&options[0].b.phase!=='driving'?options[0].slot:-1;
}
// Live commands are replayable. No passenger or bay is released before its animation ends.
function transition(level,previous,action){
 if(!action||typeof action.type!=='string')return {ok:false,reason:'action'};
 const state=copy(previous),id=action.id,slot=state.bays.findIndex(b=>b&&b.id===id),bay=state.bays[slot];
 if(action.type==='send'){
  if(!Number.isInteger(id)||!state.parked.includes(id))return {ok:false,reason:'missing'};
  const blockedBy=blockers(level,state,id);if(blockedBy.length)return {ok:false,reason:'blocked',blockedBy};
  const free=state.bays.indexOf(null);if(free<0)return {ok:false,reason:'full'};
  state.parked=state.parked.filter(n=>n!==id);state.exiting.push(id);state.moves++;
  state.bays[free]={id,filled:0,ticket:state.moves,phase:'driving'};
 }else if(action.type==='clear'){
  if(!bay||bay.phase!=='driving'||!state.exiting.includes(id))return {ok:false,reason:'phase'};
  state.exiting=state.exiting.filter(n=>n!==id);
 }else if(action.type==='arrive'){
  if(!bay||bay.phase!=='driving'||state.exiting.includes(id))return {ok:false,reason:'phase'};
  bay.phase='waiting';
 }else if(action.type==='board'){
  if(slot<0||slot!==nextBoard(level,state))return {ok:false,reason:'queue'};
  bay.filled++;state.head++;if(bay.filled===car(level,id).capacity)bay.phase='leaving';
 }else if(action.type==='leave'){
  if(!bay||bay.phase!=='leaving')return {ok:false,reason:'phase'};
  state.bays[slot]=null;state.departed.push(id);
 }else return {ok:false,reason:'action'};
 return {ok:true,state};
}
function replay(level,log){let state=initial(level);if(!Array.isArray(log)||log.length>2000)throw Error('Invalid log');for(const action of log){const result=transition(level,state,action);if(!result.ok)throw Error('Invalid command');state=result.state;}return state;}
function solve(level,start=initial(level),budget=150000){
 if(level.solution){let state=copy(start),path=[];for(const id of level.solution){if(!state.parked.includes(id))continue;const r=step(level,state,id);if(!r.ok)break;state=r.state;path.push(id);}if(won(level,state))return {path,visited:path.length,exhausted:false};}
 let visited=0,exhausted=false;const seen=new Set();
 function visit(state){
  if(won(level,state))return [];
  const k=key(state);if(seen.has(k))return null;seen.add(k);
  if(++visited>budget){exhausted=true;return null;}
  const candidates=legal(level,state).map(id=>({id,r:step(level,state,id)}));candidates.sort((a,b)=>b.r.state.head-a.r.state.head);
  for(const {id,r} of candidates){if(exhausted)break;const rest=visit(r.state);if(rest)return [id,...rest];}
  return null;
 }
 const path=visit(copy(start));return {path,visited,exhausted};
}
function analyze(level,budget=200000){
 // Exact probability for uniform random legal moves, not human difficulty.
 const memo=new Map();let states=0,deadEnds=0,firstTrap=null;
 function visit(s,path){
  if(won(level,s))return 1;const k=key(s);if(memo.has(k))return memo.get(k);
  if(++states>budget)throw Error('Analysis budget exceeded');
  const options=legal(level,s);if(!options.length){deadEnds++;if(!firstTrap)firstTrap=path;memo.set(k,0);return 0;}
  const probability=options.reduce((n,id)=>n+visit(step(level,s,id).state,[...path,id]),0)/options.length;
  memo.set(k,probability);return probability;
 }
 const randomWin=visit(initial(level),[]);return {randomWin,states,deadEnds,trap:firstTrap};
}
function validate(level){
 const errors=[],cells=new Set(),ids=new Set(),seats={},people={};
 const width=level.width||level.size,height=level.height||level.size;
 if(!Number.isInteger(width)||!Number.isInteger(height)||width<4||width>12||height<4||height>30)errors.push('size');
 if(!Array.isArray(level.cars)||level.cars.length<1||level.cars.length>40)return ['cars'];
 for(const c of level.cars){
  if(!Number.isInteger(c.id)||ids.has(c.id))errors.push('id');ids.add(c.id);
  if(!['N','S','E','W'].includes(c.dir))errors.push('direction');
  if(!Number.isInteger(c.color)||c.color<0||c.color>3)errors.push('color');
  if(!Number.isInteger(c.capacity)||c.capacity<2||c.capacity>6)errors.push('capacity');
  if(![c.x,c.y,c.w,c.h].every(Number.isInteger)||c.w<1||c.h<1)errors.push('geometry');
  if((c.dir==='N'||c.dir==='S')?(c.w!==1||![2,3].includes(c.h)):(c.h!==1||![2,3].includes(c.w)))errors.push('orientation');
  for(let x=c.x;x<c.x+c.w;x++)for(let y=c.y;y<c.y+c.h;y++){
   if(x<0||y<0||x>=width||y>=height)errors.push('bounds');const k=x+','+y;if(cells.has(k))errors.push('overlap');cells.add(k);
  }
  seats[c.color]=(seats[c.color]||0)+c.capacity;
 }
 if(!Array.isArray(level.queue))return [...errors,'queue'];
 for(const color of level.queue)people[color]=(people[color]||0)+1;
 for(const color of new Set([...Object.keys(seats),...Object.keys(people)]))if(seats[color]!==people[color])errors.push('passenger balance');
 return errors;
}
const API={copy,initial,car,blockers,settle,step,won,legal,deadlocked,solve,analyze,validate,key,active,nextBoard,transition,replay};
if(typeof module!=='undefined'&&module.exports)module.exports=API;else root.ParkingEngine=API;
})(typeof window!=='undefined'?window:globalThis);

function cancelMotion(){epoch++;for(const a of animations)a.cancel();animations.clear();document.querySelectorAll('.ghost-car,.fly-person').forEach(el=>el.remove());boarding=false;departures.clear();roadTail=Promise.resolve();}
async function drive(id,token){
 const c=E.car(level(),id),parking=$('parking'),cell=parking.clientWidth/level().width,world=$('lot-world'),origin={x:parking.offsetLeft+(c.x+c.w/2)*cell,y:parking.offsetTop+(c.y+c.h/2)*cell},w=cell*.84,h=cell*Math.max(c.w,c.h)*.88;
 const edge={x:origin.x,y:origin.y};if(c.dir==='N')edge.y=-h/2;else if(c.dir==='S')edge.y=world.clientHeight+h/2;else if(c.dir==='W')edge.x=-h/2;else edge.x=world.clientWidth+h/2;
 const g=ghost(c,origin.x,origin.y,w,h,0,true),distance=Math.hypot(edge.x-origin.x,edge.y-origin.y);
 if(!await animate(g,[{transform:`rotate(${angles[c.dir]}deg)`},{transform:`translate(${edge.x-origin.x}px,${edge.y-origin.y}px) rotate(${angles[c.dir]}deg)`}],Math.max(950,distance/145*1000),token)){g.remove();return;}g.remove();act({type:'clear',id});
 // A shared approach lane prevents vehicles crossing each other at the curb.
 const previous=roadTail;let release;roadTail=new Promise(resolve=>release=resolve);await previous;
 try{
  if(token!==epoch)return;const slot=state.bays.findIndex(b=>b?.id===id);if(slot<0)return;
  const road=document.querySelector('.road').getBoundingClientRect(),target=center(document.querySelector(`[data-slot="${slot}"] .slot-number`)),from={x:road.left-35,y:road.top+road.height/2};
  const probe=document.createElement('div');probe.className='bay-car';const bayEl=document.querySelector(`[data-slot="${slot}"]`);bayEl.classList.toggle('long',c.capacity===6);bayEl.append(probe);const box=probe.getBoundingClientRect();target.x=box.left+box.width/2;target.y=box.top+box.height/2;probe.remove();
  const car=ghost(c,from.x,from.y,box.width,box.height);const scale=1;
  const frames=[{transform:'rotate(90deg)'},{transform:`translate(${target.x-from.x-24}px,0) rotate(90deg)`,offset:.65},{transform:`translate(${target.x-from.x}px,-22px) rotate(0deg)`,offset:.8},{transform:`translate(${target.x-from.x}px,${target.y-from.y}px) rotate(0deg) scale(${scale})`}];
  const ok=await animate(car,frames,Math.max(1800,(target.x-from.x+90)/120*1000),token);car.remove();if(!ok)return;
  act({type:'arrive',id});tone(390);pump(token);
 }finally{release();}
}
async function boardOne(slot,token){const bay=state.bays[slot],id=bay.id,c=E.car(level(),id),source=$('queue').querySelector('.person'),target=document.querySelector(`[data-bay-car="${id}"] [data-seat="${bay.filled}"]`);if(!source||!target)return false;
 const from=center(source),to=center(target),walkY=center(document.querySelector('.walkway')).y,door={x:to.x+24,y:to.y};const el=document.createElement('div');el.className='fly-person';el.style.left=from.x-15+'px';el.style.top=from.y-21+'px';el.innerHTML=person(c.color,state.head);document.body.append(el);source.classList.add('walking-out');
 const ok=await animate(el,[{transform:'translate(0,0) scale(1)'},{transform:`translate(0,${walkY-from.y}px) scale(.95)`,offset:.2},{transform:`translate(${door.x-from.x}px,${walkY-from.y}px) scale(.9)`,offset:.6},{transform:`translate(${door.x-from.x}px,${to.y-from.y}px) scale(.72)`,offset:.83},{transform:`translate(${to.x-from.x}px,${to.y-from.y}px) scale(.28)`}],1050+slot*100,token);el.remove();if(!ok)return false;
 act({type:'board',id});tone(550+bay.filled*40);return true;
}
async function depart(id,token){
 if(departures.has(id))return;departures.add(id);const slot=state.bays.findIndex(b=>b?.id===id),c=E.car(level(),id),bay=document.querySelector(`[data-slot="${slot}"]`),carEl=bay.querySelector('.bay-car'),from=center(carEl),carBox=carEl.getBoundingClientRect();
 const road=document.querySelector('.road').getBoundingClientRect(),dy=road.top+road.height/2-from.y,g=ghost(c,from.x,from.y,carBox.width,carBox.height,c.capacity);
 const ok=await animate(g,[{transform:'rotate(0deg)'},{transform:`translate(0,${dy-18}px) rotate(0deg)`,offset:.35},{transform:`translate(23px,${dy}px) rotate(90deg)`,offset:.55},{transform:`translate(${road.right-from.x+65}px,${dy}px) rotate(90deg)`}],2400,token);g.remove();if(token!==epoch)return;departures.delete(id);if(!ok)return;act({type:'leave',id});tone(780);pump(token);finishCheck();
}
async function pump(token=epoch){
 if(token!==epoch)return;for(const b of state.bays.filter(Boolean))if(b.phase==='leaving')depart(b.id,token);
 if(boarding)return;boarding=true;
 try{let slot;while(token===epoch&&(slot=E.nextBoard(level(),state))>=0){if(!await boardOne(slot,token))break;for(const b of state.bays.filter(Boolean))if(b.phase==='leaving')depart(b.id,token);}}
 finally{if(token===epoch){boarding=false;finishCheck();}}
}
function finishCheck(){if(E.won(level(),state)){if($('overlay').hidden)complete();return;}showStatus();}
function indicateBlock(id,blocked){document.querySelector(`[data-car="${id}"]`)?.classList.add('bump');const other=blocked[0];document.querySelector(`[data-car="${other}"]`)?.classList.add('obstacle');message('Önü kapalı. '+names[E.car(level(),other).color]+' araç yolu açınca çıkabilir.',true);tone(180);const token=epoch;setTimeout(()=>{if(token!==epoch)return;document.querySelectorAll('.bump,.obstacle').forEach(el=>el.classList.remove('bump','obstacle'));},1600);}
function dispatch(id){if(!$('overlay').hidden)return;const r=act({type:'send',id});if(!r.ok){if(r.reason==='blocked')indicateBlock(id,r.blockedBy);else if(r.reason==='full')message(E.active(level(),state)?'Üç yer de ayrılmış. Bir araç perondan çıkınca yer açılacak.':'Durak dolu. Son aracı geri alıp sıradaki yolcuya yer aç.',true);return r;}
 message(names[E.car(level(),id).color]+' araç yolda. Boş yer varsa başka bir araç da gönderebilirsin.');drive(id,epoch);return r;}
function openModal(html){focused=document.activeElement;$('modal-content').innerHTML=html;$('overlay').hidden=false;$('app').inert=true;($('modal-content').querySelector('button')||$('close-modal')).focus();updateMoods();}
function closeModal(){if($('overlay').hidden)return;$('overlay').hidden=true;$('app').inert=false;(focused?.isConnected?focused:$('level-menu')).focus();if(E.won(level(),state)&&!completed[index])complete();}
function help(first=false){openModal(`<div class="eyebrow">HOŞ GELDİN · ACELE YOK</div><h2 id="modal-title">Şehrin yolu<br>senden sorulur.</h2><div class="rule"><b>1</b><span>Araca dokun. <strong>Önü açıksa</strong> ok yönünde çıkar.</span></div><div class="rule"><b>2</b><span>Sıranın başındaki yolcu kendi rengindeki araca biner. <strong>Dolan araç ayrılır.</strong></span></div><div class="rule"><b>3</b><span>Üç peron var. Araçlar hareket ederken <strong>diğerlerini de gönderebilirsin.</strong></span></div><p>Otoparkın tamamı ekranda. Yakınlaştır ile büyüt; Tüm park ile geri dön. Açık araçlardaki boş koltukları sayabilirsin.</p><p class="mini-note">Yolcular bazen söylenir, bazen tuvalet arar. Bunlar yalnızca hareket: puan, ceza veya süre sınırı yok.</p><div class="chips"><span class="chip">Ücretsiz geri al</span><span class="chip">3 renk + şekiller</span><span class="chip">Yavaş hareket</span></div><button class="primary" data-action="start">${first?'Otoparka gir →':'Oyuna dön →'}</button>`);}
function queueDetails(){openModal(`<div class="eyebrow">ÖNDEN ARKAYA · SOLDAN SAĞA</div><h2 id="modal-title">${level().queue.length-state.head} yolcu bekliyor.</h2><p>İlk çerçevedeki yolcu biner. Onun aracı yoksa arkasındakiler de bekler.</p><div class="queue-list">${level().queue.slice(state.head).map((c,i)=>person(c,state.head+i)).join('')||'Herkes bindi.'}</div><div class="legend">${names.slice(0,index<8?3:4).map((n,i)=>`<span>${shape(i,colors[i])}${n}</span>`).join('')}</div><button class="primary" data-action="close">Oyuna dön →</button>`);}
function levelMenu(){openModal(`<div class="eyebrow">18 OTOPARK · 48–120 YOLCU</div><h2 id="modal-title">Şehirde bir tur.</h2><p>Her otopark aynı düzenle başlar. Bölüm ilerledikçe araç sayısı ve planlanacak yollar artar.</p><div class="levels-grid">${levels.map((l,i)=>`<button data-level="${i}" class="${completed[i]?'done ':''}${i===index?'current':''}" aria-label="Bölüm ${l.id}, ${l.title}">${String(l.id).padStart(2,'0')}<small>${completed[i]?'✓':l.cars.length+' araç'}</small></button>`).join('')}</div><p class="mini-note">Denemek için bütün bölümler açık. Mor renk 9. bölümde eklenir.</p>`);}
function overview(){zoomed=!zoomed;fitLot();$('lot-viewport').scrollTop=0;$('lot-viewport').scrollLeft=0;message(zoomed?'Yakın görünüm açık. Parkı kaydırabilir, Tüm park ile geri dönebilirsin.':'Otoparkın tamamı ekranda. Araçlara buradan dokunarak oynayabilirsin.');}
function reset(i){cancelMotion();index=i;state=E.initial(level());log=[];levelStarted=Date.now();moodOffset=0;layoutLot();save();render();showStatus();}
function undo(){let last=log.length-1;while(last>=0&&log[last].type!=='send')last--;if(last<0)return;cancelMotion();log=log.slice(0,last);state=E.replay(level(),log);finishInstant();queueHead=-1;save();render();message('Son gönderdiğin araç geri döndü. Önceki araçlar perondaki işlemlerini tamamladı.');}
function hint(){if(E.active(level(),state)){message('İpucunu araçlar yerleşince hesaplayabilirim. Bu sırada araç göndermeye devam edebilirsin.');return;}const plan=E.solve(level(),state,12000);if(!plan.path){message(plan.exhausted?'Bu konum için ipucu bulunamadı. Son hamleyi geri almayı deneyebilirsin.':'Bu sırayla çözüm kalmadı. Son aracı geri al.',true);return;}const id=plan.path[0];if(id===undefined)return;const el=document.querySelector(`[data-car="${id}"]`);el?.classList.add('hinted');if(el&&zoomed){const v=$('lot-viewport'),r=el.getBoundingClientRect(),vr=v.getBoundingClientRect();v.scrollTo({top:v.scrollTop+r.top-vr.top-v.clientHeight/2+r.height/2,behavior:reduced?'instant':'smooth'});}message(names[E.car(level(),id).color]+' araç işaretlendi. Çözüm için güvenli bir sonraki hamle.',true);}
function complete(){completed[index]=true;save();openModal(`<div class="eyebrow">ŞEHİR BİR NEFES ALDI</div><div class="win-icon">✦</div><h2 id="modal-title">Park açıldı!</h2><p>Bütün araçlar yola çıktı. Herkes kendi koltuğuna yerleşti.</p><div class="stats"><div><b>${level().cars.length}</b><small>ARAÇ</small></div><div><b>${level().queue.length}</b><small>YOLCU</small></div></div><button class="primary" data-action="${index<levels.length-1?'next':'levels'}">${index<levels.length-1?'Sonraki otopark →':'Bölümlere dön →'}</button><button class="secondary" data-action="retry">Yeniden oyna</button>`);tone(950,.2);}
$('cars').addEventListener('click',event=>{const el=event.target.closest('[data-car]');if(el)dispatch(+el.dataset.car);});
$('undo').addEventListener('click',undo);$('hint').addEventListener('click',hint);$('restart').addEventListener('click',()=>{if(!log.length){reset(index);return;}openModal('<div class="eyebrow">AYNI OTOPARK, YENİ PLAN</div><h2 id="modal-title">Baştan başlayalım mı?</h2><p>Araçlar ve sıra aynı kalır. Bu bölümdeki hamlelerin sıfırlanır.</p><button class="primary" data-action="retry">Yeniden başlat</button><button class="secondary" data-action="close">Oyuna dön</button>');});
$('speed').addEventListener('click',()=>{speed=speed===1?1.3:1;save();$('speed').querySelector('small').textContent=speed===1?'Sakin':'Normal';message(speed===1?'Sakin hız açık. Araç ve yolcu hareketlerini rahatça takip et.':'Normal hız açık. Sakin hıza istediğin zaman dönebilirsin.');});
$('sound').addEventListener('click',()=>{sound=!sound;save();render();if(sound)tone(650);});$('help').addEventListener('click',()=>help());$('queue-info').addEventListener('click',queueDetails);$('overview').addEventListener('click',overview);$('level-menu').addEventListener('click',levelMenu);
$('lot-viewport').addEventListener('scroll',()=>{if(!zoomed)return;const progress=$('lot-viewport').scrollTop/Math.max(1,$('lot-world').clientHeight-$('lot-viewport').clientHeight);$('lot-position').textContent=Math.round(progress*100)+'%';});
$('close-modal').addEventListener('click',()=>{seen=true;save();closeModal();});
$('modal-content').addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.level!==undefined){const i=+b.dataset.level;if(Number.isInteger(i)&&i>=0&&i<levels.length){closeModal();reset(i);}return;}switch(b.dataset.action){case'start':seen=true;save();closeModal();break;case'close':closeModal();break;case'next':closeModal();reset(Math.min(index+1,levels.length-1));break;case'retry':closeModal();reset(index);break;case'levels':levelMenu();break;}});
document.addEventListener('keydown',event=>{if($('overlay').hidden)return;if(event.key==='Escape'){event.preventDefault();seen=true;save();closeModal();}if(event.key==='Tab'){const buttons=[...$('overlay').querySelectorAll('button:not(:disabled)')],first=buttons[0],last=buttons[buttons.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
document.documentElement.style.setProperty('--app-height',Math.floor(window.visualViewport?.height||innerHeight)+'px');
load();state=state||E.initial(level());layoutLot();render();showStatus();
addEventListener('resize',resizeGame);window.visualViewport?.addEventListener('resize',resizeGame);if(window.ResizeObserver)new ResizeObserver(fitLot).observe($('lot-viewport'));resizeGame();setInterval(updateMoods,4000);if(!seen)help(true);else if(E.won(level(),state))complete();
if(testMode)window.ParkingTest={E,levels,get:()=>({index,state:E.copy(state),log:E.copy(log),busy:E.active(level(),state)||boarding}),load:i=>{closeModal();reset(i);},dispatch,undo,close:closeModal,solve:()=>E.solve(level(),state),storageKey:KEY,moods:ms=>{moodOffset=ms;updateMoods();}};
})();

</script></body></html>
